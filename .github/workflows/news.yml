name: General News Bot — Technology & Economy

# One post per run, rotating through a fixed seven-category cycle.
# GitHub may delay scheduled workflows by a few minutes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: general-news-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore rotation + duplicate protection state
        uses: actions/cache/restore@v4
        with:
          path: state/posted.json
          key: newsbot-state-${{ github.run_id }}
          restore-keys: |
            newsbot-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          MAX_POSTS_PER_RUN: "1"
          MAX_AGE_HOURS: "36"
          STATE_FILE: "state/posted.json"
        run: python bot.py

      - name: Save rotation + duplicate protection state
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state/posted.json
          key: newsbot-state-${{ github.run_id }}
