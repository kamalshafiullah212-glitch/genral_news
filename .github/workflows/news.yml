name: General News Bot — Daily Pashto News

# date + rates once a day after 06:00 Asia/Kabul; other news published as soon
# as it is found, paced to reach at least 15 posts per day.
# GitHub may delay scheduled workflows by a few minutes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: general-news-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore rotation + duplicate protection state
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: state/posted.json
          key: newsbot-state-${{ github.run_id }}
          restore-keys: |
            newsbot-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # LLM writer (preferred: Groq; default model openai/gpt-oss-120b)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # optional alternative provider: xAI Grok
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          MAX_POSTS_PER_RUN: "1"
          MAX_AGE_HOURS: "36"
          # date + rates once a day right after 06:00 Asia/Kabul
          DAY_ANCHOR_HOUR: "6"
          # spread the news posts across the day: 15 minimum, ~20 maximum
          DAILY_MIN_POSTS: "15"
          DAILY_MAX_POSTS: "20"
          CATCHUP_MAX_AGE_HOURS: "168"
          STATE_FILE: "state/posted.json"
        run: python bot.py

      - name: Save rotation + duplicate protection state
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state/posted.json
          key: newsbot-state-${{ github.run_id }}
